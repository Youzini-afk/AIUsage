[package]
name = "aiusage-windows-desktop"
version = "0.13.0"
description = "AIUsage Windows desktop shell"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "aiusage_windows_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aiusage-tauri = { path = "../crates/aiusage-tauri" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
