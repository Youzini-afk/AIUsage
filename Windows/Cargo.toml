[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/aiusage-core",
    "crates/aiusage-platform",
    "crates/aiusage-proxy",
    "crates/aiusage-services",
    "crates/aiusage-windows",
    "crates/aiusage-tauri",
    "crates/aiusage-fixtures",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Youzini-afk/AIUsage"
rust-version = "1.80"

[workspace.dependencies]
aiusage-core = { path = "crates/aiusage-core" }
aiusage-platform = { path = "crates/aiusage-platform" }
aiusage-proxy = { path = "crates/aiusage-proxy" }
aiusage-services = { path = "crates/aiusage-services" }
aiusage-windows = { path = "crates/aiusage-windows" }
aiusage-tauri = { path = "crates/aiusage-tauri" }
aiusage-fixtures = { path = "crates/aiusage-fixtures" }
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
