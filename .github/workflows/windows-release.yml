name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY || secrets.TAURI_SIGNING_PUBLIC_KEY }}
      WINDOWS_UPDATE_ENDPOINT: ${{ vars.WINDOWS_UPDATE_ENDPOINT }}
      WINDOWS_UPDATE_BASE_URL: ${{ vars.WINDOWS_UPDATE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $package = Get-Content Windows/package.json -Raw | ConvertFrom-Json
            $version = $package.version
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          "Resolved version: $version"

      - name: Validate Windows version metadata
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $package = Get-Content Windows/package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content Windows/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoToml = Get-Content Windows/src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value

          "package.json:      $($package.version)"
          "tauri.conf.json:   $($tauri.version)"
          "src-tauri Cargo:   $cargoVersion"
          "expected:          $expected"

          if ($package.version -ne $expected) { throw "Windows/package.json version mismatch" }
          if ($tauri.version -ne $expected) { throw "Windows/src-tauri/tauri.conf.json version mismatch" }
          if ($cargoVersion -ne $expected) { throw "Windows/src-tauri/Cargo.toml version mismatch" }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        working-directory: Windows
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: Windows
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path Windows/Cargo.toml --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path Windows/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --manifest-path Windows/Cargo.toml --workspace

      - name: Import Windows signing certificate
        id: windows_signing
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "aiusage-windows-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

          $importArgs = @{
            FilePath = $certPath
            CertStoreLocation = "Cert:\CurrentUser\My"
          }
          if (-not [string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            $importArgs.Password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          }

          $cert = Import-PfxCertificate @importArgs
          if ($null -eq $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) {
            throw "Windows signing certificate import did not return a thumbprint"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "thumbprint=$($cert.Thumbprint)"
          Remove-Item -LiteralPath $certPath -Force

      - name: Prepare release build config
        id: release_config
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
        run: |
          $hasSigning = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_THUMBPRINT)
          $hasUpdater = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) `
            -and -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)

          if (-not $hasSigning -and -not $hasUpdater) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "enabled=false"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "signing_enabled=false"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_enabled=false"
            "Using base Tauri config without Windows signing or updater artifacts."
            return
          }

          $config = Get-Content Windows/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json

          if ($hasSigning) {
            if ($null -eq $config.bundle.windows) {
              $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
            }
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $env:WINDOWS_SIGNING_THUMBPRINT -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue $env:WINDOWS_TIMESTAMP_URL -Force
          }

          if ($hasUpdater) {
            $endpoint = $env:WINDOWS_UPDATE_ENDPOINT
            if ([string]::IsNullOrWhiteSpace($endpoint)) {
              $endpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
            }

            $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
            if ($null -eq $config.plugins) {
              $config | Add-Member -NotePropertyName plugins -NotePropertyValue ([pscustomobject]@{}) -Force
            }
            $config.plugins | Add-Member -NotePropertyName updater -NotePropertyValue ([pscustomobject]@{
              pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
              endpoints = @($endpoint)
              windows = [pscustomobject]@{ installMode = "passive" }
            }) -Force
          }

          $configPath = "src-tauri/tauri.windows-release.conf.json"
          $config | ConvertTo-Json -Depth 20 | Set-Content -Path "Windows/$configPath" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "enabled=true"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "config=$configPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "signing_enabled=$($hasSigning.ToString().ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "updater_enabled=$($hasUpdater.ToString().ToLowerInvariant())"

      - name: Build Tauri bundles
        working-directory: Windows
        shell: pwsh
        run: |
          if ("${{ steps.release_config.outputs.enabled }}" -eq "true") {
            pnpm tauri build --bundles nsis,msi --config "${{ steps.release_config.outputs.config }}"
          } else {
            pnpm tauri build --bundles nsis,msi
          }

      - name: Verify Windows signatures
        if: ${{ steps.release_config.outputs.signing_enabled == 'true' }}
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem Windows/target/release -Filter "*.exe" -File -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem Windows/target/release/bundle -Recurse -Include "*.exe","*.msi" -File
          if ($artifacts.Count -eq 0) { throw "No Windows artifacts found to verify" }

          foreach ($artifact in $artifacts) {
            "Verifying $($artifact.FullName)"
            & signtool verify /pa /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $($artifact.FullName)" }
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $setup = Get-ChildItem Windows/target/release/bundle/nsis -Filter "*.exe" -File | Select-Object -First 1
          $msi = Get-ChildItem Windows/target/release/bundle/msi -Filter "*.msi" -File | Select-Object -First 1
          if ($null -eq $setup) { throw "NSIS setup.exe was not produced" }
          if ($null -eq $msi) { throw "MSI was not produced" }

          Copy-Item $setup.FullName "$dist/AIUsage-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName "$dist/AIUsage-$version-windows-x64.msi"

          $setupSig = "$($setup.FullName).sig"
          $msiSig = "$($msi.FullName).sig"
          if (Test-Path -LiteralPath $setupSig) {
            Copy-Item $setupSig "$dist/AIUsage-$version-windows-x64-setup.exe.sig"
          }
          if (Test-Path -LiteralPath $msiSig) {
            Copy-Item $msiSig "$dist/AIUsage-$version-windows-x64.msi.sig"
          }

          $setupSigDist = "$dist/AIUsage-$version-windows-x64-setup.exe.sig"
          if (Test-Path -LiteralPath $setupSigDist) {
            $baseUrl = $env:WINDOWS_UPDATE_BASE_URL
            if ([string]::IsNullOrWhiteSpace($baseUrl) -and "${{ github.ref_type }}" -eq "tag") {
              $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
            }

            if (-not [string]::IsNullOrWhiteSpace($baseUrl)) {
              $signature = (Get-Content $setupSigDist -Raw).Trim()
              $artifactUrl = "$($baseUrl.TrimEnd('/'))/AIUsage-$version-windows-x64-setup.exe"
              $manifest = [ordered]@{
                version = $version
                notes = "AIUsage Windows $version"
                pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                platforms = [ordered]@{
                  "windows-x86_64" = [ordered]@{
                    signature = $signature
                    url = $artifactUrl
                  }
                }
              }
              $manifest | ConvertTo-Json -Depth 10 | Set-Content "$dist/latest.json" -Encoding utf8
            } else {
              "Updater signatures were produced, but latest.json was skipped because no release URL is available."
            }
          }

          Get-ChildItem $dist -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content "$dist/AIUsage-$version-windows-x64-SHA256SUMS.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AIUsage-${{ steps.version.outputs.version }}-Windows-x64
          path: dist/windows/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/windows/*
